name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer run on the same ref makes the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/*.trx

      - name: Publish web application
        run: >
          dotnet publish src/CustomerSpike.Web -c Release --no-build
          -p:Version=${{ env.VERSION }} -o publish/web

      # win-x64 produces CustomerSpike.StatusMonitor.exe; the package is framework-dependent.
      - name: Publish status monitor (Windows service)
        run: >
          dotnet publish src/CustomerSpike.StatusMonitor -c Release -r win-x64 --self-contained false
          -p:Version=${{ env.VERSION }} -o publish/monitor

      - name: Create zip packages
        run: |
          mkdir -p artifacts
          (cd publish/web && zip -qr ../../artifacts/CustomerSpike.Web-${VERSION}.zip .)
          (cd publish/monitor && zip -qr ../../artifacts/CustomerSpike.StatusMonitor-${VERSION}.zip .)
          ls -l artifacts

      - name: Upload zip packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.VERSION }}
          path: artifacts/*.zip
          if-no-files-found: error

  lint-scripts:
    name: Lint PowerShell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($results) { throw "$(@($results).Count) PSScriptAnalyzer finding(s)." }

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/web
      # Do not upload the *.dockerbuild build-record artifacts: they only clutter the run page.
      DOCKER_BUILD_RECORD_UPLOAD: false
      # Only publish from main and version tags; pull requests just prove the image builds.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha

      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: customer-spike-web:ci
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image really starts, that its HEALTHCHECK turns healthy and that the app answers.
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8080 customer-spike-web:ci
          status=starting
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            echo "health status: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          if [ "$status" != "healthy" ]; then docker logs smoke; exit 1; fi
          curl -fsS http://localhost:8080/health; echo
          curl -fsS -o page.html http://localhost:8080/
          grep -q "Customer Spike" page.html
          curl -fsS -X POST http://localhost:8080/api/customers \
            -H 'Content-Type: application/json' -d '{"fullName":"CI","email":"ci@example.com"}'; echo
          docker rm -f smoke

      - name: Build and push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
